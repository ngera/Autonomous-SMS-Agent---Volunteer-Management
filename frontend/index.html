<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon-blue.svg" />
    <link rel="apple-touch-icon" href="/brand/icon-blue-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mustr — Your nonprofit's growth team. By text.</title>
    <meta
      name="description"
      content="mustr is your nonprofit's growth team — AI agents that recruit volunteers, fill shifts, send reminders, and run donation campaigns over plain SMS."
    />
    <meta property="og:title" content="mustr — Your nonprofit's growth team. By text." />
    <meta
      property="og:description"
      content="AI agents that recruit, schedule, retain, and fundraise — all over plain SMS."
    />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:type" content="website" />
    <script>
      // Apply theme before paint to avoid a flash. Keep in sync with
      // src/hooks/use-theme.ts (same STORAGE_KEY, same default).
      (function () {
        try {
          var stored = localStorage.getItem("booking-system:theme");
          var mode = stored === "light" ? "light" : "dark";
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
